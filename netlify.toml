[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Same /api/* paths as Vercel, proxied to Netlify Functions.
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 302

# SPA fallback. Existing files in /admin, /assets, /images, /audio are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
