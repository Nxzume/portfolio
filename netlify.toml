[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Same /api/* paths as Vercel, proxied to Netlify Functions.
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 302

# Every real page is prerendered to a file and the filesystem is checked first,
# so anything reaching here does not exist.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
