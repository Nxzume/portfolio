# Edit your site at /admin/ (after GitHub login — see README).
# Tip: use the form on the LEFT. The RIGHT side is a live look-ahead only.

backend:
  name: github
  repo: Nxzume/portfolio
  branch: master
  # base_url + auth_endpoint are set at runtime from the current site origin
  base_url: /
  auth_endpoint: api/auth

# Edits become drafts instead of going straight to the live site.
# Save = draft (can make many changes). Publish = live.
# There is no separate Vercel preview URL — use the form's right-hand look-ahead,
# then Publish when ready.
#
# Media: upload photos/audio from the field on the entry you are editing (not the
# Media tab). Those files ride along with the draft and only go live on Publish.
# The Media tab commits straight to master and is hidden for that reason.
publish_mode: editorial_workflow

site_url: https://portfolio-five-steel-37.vercel.app

# Uncomment for local editing with: npx decap-server
# local_backend: true

media_folder: public/images
public_folder: /images

# Upload size limit is global via /admin/upload-limit.json (applied at boot).
# Do not add top-level media_library here — Decap requires media_library.name for
# external libraries only, which breaks the built-in uploader.

logo_url: /favicon.svg
locale: en

collections:
  - name: site_content
    label: Homepage & shared text
    description: "Pick a section below to edit. Upload photos or audio from the fields on that page — they stay in the draft until you Publish."
    editor:
      preview: true
      visualEditing: false
    files:
      - name: site
        label: Your name, email & links
        file: content/site.json
        fields:
          - { label: Your name, name: name, widget: string, hint: "Shows in the nav, homepage, footer, and browser tab" }
          - { label: Short tagline under your name, name: tagline, widget: string }
          - { label: Email address, name: email, widget: string, hint: "Used by the Contact email button" }
          - { label: Website address, name: url, widget: string, required: false, hint: "Only change this if the site moves to a new domain. Used for Google and for the preview card people see when they share a link." }
          - label: Links (shown on Contact)
            name: links
            widget: object
            collapsed: false
            hint: "Project Play / itch / GitHub buttons are edited on each Project page — not here."
            fields:
              - { label: GitHub profile URL, name: github, widget: string, required: false, hint: "Your personal profile, e.g. https://github.com/alexandreguichet" }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false, hint: "Paste your LinkedIn profile when you have one" }

      - name: hero
        label: Homepage — top banner
        file: content/hero.json
        fields:
          - { label: Headline, name: headline, widget: string }
          - label: Background photo
            name: image
            widget: image
            choose_url: false
          - label: Main button
            name: primaryCta
            widget: object
            fields:
              - { label: Button text, name: label, widget: string }
              - { label: Link, name: href, widget: string, hint: "Examples: #compose  #projects  or a full https:// link" }
          - label: Second button
            name: secondaryCta
            widget: object
            fields:
              - { label: Button text, name: label, widget: string }
              - { label: Link, name: href, widget: string }

      - name: focuses
        label: Homepage — focus tabs
        file: content/focuses.json
        fields:
          - label: Tabs
            name: tabs
            label_singular: tab
            widget: list
            summary: "{{fields.label}}"
            collapsed: true
            fields:
              - { label: Tab label, name: label, widget: string }
              - { label: Headline, name: headline, widget: string, required: false }
              - { label: Text, name: body, widget: text, required: false }
              - { name: id, widget: hidden, default: "" }

      - name: score
        label: Homepage — music section title
        file: content/score.json
        fields:
          - { label: Small label above the title, name: eyebrow, widget: string, required: false }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Short intro text, name: lede, widget: text, required: false }

      - name: sketches
        label: Homepage — music tracks
        file: content/sketches.json
        fields:
          - label: Tracks
            name: tracks
            label_singular: track
            widget: list
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Line under the title (optional), name: mood, widget: string, required: false }
              - label: Audio file
                name: audio
                widget: file
                required: false
                choose_url: false
                media_folder: ../audio
                public_folder: /audio
                hint: "Prefer mp3, wav, or ogg. Leave empty to use a simple placeholder tone."
              - { name: id, widget: hidden, default: "" }
              - { label: "Advanced: tone speed (BPM) if no audio file", name: bpm, widget: number, value_type: int, required: false, hint: "Ignore this if you uploaded an audio file" }
              - { label: "Advanced: tone pitch if no audio file", name: baseFreq, widget: number, required: false, value_type: float, hint: "Ignore this if you uploaded an audio file" }
              - label: "Advanced: tone melody steps if no audio file"
                name: pattern
                label_singular: step
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.step}}"
                hint: "Ignore this if you uploaded an audio file. Numbers like 0, 4, 7 make a simple melody."
                fields:
                  - { label: Step, name: step, widget: number, value_type: int }

      - name: projects_section
        label: Homepage — projects section title
        file: content/projects-section.json
        fields:
          - { label: Small label above the title, name: eyebrow, widget: string, required: false }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Short intro text, name: lede, widget: text, required: false }

      - name: about
        label: Homepage — about me
        file: content/about.json
        fields:
          - label: Photo
            name: portrait
            widget: image
            choose_url: false
            required: false
          - { label: Photo description (optional), name: portraitAlt, widget: string, required: false, hint: "For screen readers. Leave blank to use your name." }
          - { label: Headline, name: lead, widget: string, required: false }
          - label: Bio text
            name: body
            label_singular: paragraph
            widget: list
            required: false
            default: []
            collapsed: true
            summary: "{{fields.paragraph | truncate(80)}}"
            fields:
              - { label: Text, name: paragraph, widget: text }
          - { label: Small note at the bottom (optional), name: note, widget: text, required: false }

      - name: contact
        label: Homepage — contact
        file: content/contact.json
        fields:
          - { label: Small label above the title, name: eyebrow, widget: string, required: false }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Short intro text, name: lede, widget: text, required: false }
          - { label: Email button text (optional), name: emailButtonText, widget: string, required: false, hint: "Email / itch / GitHub destinations come from “Your name, email & links”" }

  - name: game_projects
    label: Project pages
    label_singular: Project
    description: "Each project is a card on the homepage and its own page. Upload cover/gallery photos on this form so they stay with the draft until Publish. Deleting a live project is disabled here — ask the site owner."
    folder: content/projects
    create: true
    delete: false
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{title}}"
    editor:
      preview: true
      visualEditing: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Small label above the title, name: subtitle, widget: string, required: false, default: "", hint: "Example: Puzzle · Unity" }
      - label: Cover photo
        name: image
        widget: image
        choose_url: false
        required: false
        hint: "Shown on the homepage card and project page. Leave blank for a plain card."
      - { label: Short summary on the homepage card, name: summary, widget: text, required: false, default: "" }
      - { label: Page address, name: slug, widget: string, hint: "Becomes /projects/this-name — lowercase, no spaces. Must be unique (example: arena)." }
      - { label: Sort order on homepage, name: order, widget: number, value_type: int, default: 10, required: false, hint: "Lower numbers appear first" }
      - { name: id, widget: hidden, default: "" }
      - label: Extra photos
        name: gallery
        label_singular: photo
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "Photo"
        fields:
          - label: Photo
            name: image
            widget: image
            choose_url: false
      - label: Highlight bullets
        name: highlights
        label_singular: bullet
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "{{fields.item | truncate(60)}}"
        fields:
          - { label: Bullet text, name: item, widget: string }
      - label: Buttons
        name: links
        label_singular: button
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "{{fields.label}}"
        fields:
          - { label: Button text, name: label, widget: string }
          - { label: Link, name: href, widget: string, hint: "Full https:// link, or #contact for a jump on this site" }
      - label: Opening text
        name: intro
        label_singular: paragraph
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "{{fields.paragraph | truncate(80)}}"
        fields:
          - { label: Text, name: paragraph, widget: text }
      - label: Chapters
        name: sections
        label_singular: chapter
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "{{fields.title}}"
        fields:
          - { label: Chapter title, name: title, widget: string }
          - { name: id, widget: hidden, default: "" }
          - { label: Quote (optional), name: quote, widget: text, required: false }
          - label: Chapter text
            name: paragraphs
            label_singular: paragraph
            widget: list
            required: false
            default: []
            collapsed: true
            summary: "{{fields.paragraph | truncate(80)}}"
            fields:
              - { label: Text, name: paragraph, widget: text }
          - label: Chapter photo (optional)
            name: image
            widget: image
            required: false
            choose_url: false
          - { label: Photo description (optional), name: imageAlt, widget: string, required: false }
