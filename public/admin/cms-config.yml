# Visual editor for people who don’t write code.
# Open /admin/ on the live site after GitHub OAuth is configured (see README).

backend:
  name: github
  repo: Nxzume/portfolio
  branch: master
  # base_url + auth_endpoint are set at runtime from the current site origin
  # so the editor works on any host (Vercel, Netlify, custom domain, localhost)
  base_url: /
  auth_endpoint: api/auth

# Uncomment for local editing with: npx decap-server
# local_backend: true

media_folder: public/images
public_folder: /images

# Upload size limit is global via /admin/upload-limit.json (applied at boot).
# Do not add top-level media_library here — Decap requires media_library.name for
# external libraries only, which breaks the built-in uploader.

logo_url: /favicon.svg
locale: en

collections:
  - name: site_content
    label: Site pages
    description: Shared identity first — name, email, and links update the whole site
    # Click text in the preview to jump to that field in the form.
    editor:
      preview: true
      visualEditing: true
    files:
      - name: site
        label: Name and links (sitewide)
        file: content/site.json
        fields:
          - { label: Your name, name: name, widget: string, hint: "Used in the nav, hero, footer, photo alt text, and page title" }
          - { label: One-line description, name: tagline, widget: string, hint: "Shown under your name on the homepage" }
          - { label: Email address, name: email, widget: string, hint: "Powers the Contact email button" }
          - label: Website links
            name: links
            widget: object
            fields:
              - { label: itch.io page, name: itch, widget: string, required: false, hint: "Contact button + shared link" }
              - { label: The Arena on GitHub, name: githubArena, widget: string, required: false }
              - { label: Level on GitHub, name: githubLevel, widget: string, required: false, hint: "Also used as the Contact GitHub button" }

      - name: hero
        label: Top of homepage
        file: content/hero.json
        fields:
          - { label: Main headline, name: headline, widget: string }
          - label: Background photo
            name: image
            widget: image
            choose_url: false
            hint: "Upload or pick from the media library"
          - label: Main button
            name: primaryCta
            widget: object
            fields:
              - { label: Button text, name: label, widget: string }
              - { label: Where it goes, name: href, widget: string, hint: "Examples: #compose, #projects, or https://…" }
          - label: Second button
            name: secondaryCta
            widget: object
            fields:
              - { label: Button text, name: label, widget: string }
              - { label: Where it goes, name: href, widget: string }

      - name: about
        label: About me
        file: content/about.json
        fields:
          - label: Your photo
            name: portrait
            widget: image
            choose_url: false
            required: false
            hint: "Upload or pick from the media library"
          - { label: Photo description, name: portraitAlt, widget: string, required: false, hint: "Describes the photo for screen readers. Leave blank to use your name." }
          - { label: About headline, name: lead, widget: string, required: false }
          - label: Bio paragraphs
            name: body
            label_singular: paragraph
            widget: list
            required: false
            default: []
            summary: "{{fields.paragraph}}"
            fields:
              - { label: Paragraph, name: paragraph, widget: text }
          - { label: Small note under the bio (optional), name: note, widget: text, required: false }

      - name: contact
        label: Contact
        file: content/contact.json
        fields:
          - { label: Tiny label above the title, name: eyebrow, widget: string, required: false }
          - { label: Contact title, name: title, widget: string, required: false }
          - { label: Short description, name: lede, widget: text, required: false }
          - { label: Email button text, name: emailButtonText, widget: string, required: false, hint: "Buttons for email / itch / GitHub come from Name and links" }

      - name: score
        label: Music section heading
        file: content/score.json
        fields:
          - { label: Tiny label above the title, name: eyebrow, widget: string, required: false }
          - { label: Section title, name: title, widget: string, required: false }
          - { label: Short description, name: lede, widget: text, required: false }

      - name: projects_section
        label: Projects section heading
        file: content/projects-section.json
        fields:
          - { label: Tiny label above the title, name: eyebrow, widget: string, required: false }
          - { label: Section title, name: title, widget: string, required: false }
          - { label: Short description, name: lede, widget: text, required: false }

      - name: focuses
        label: Compose / Levels / Azure tabs
        file: content/focuses.json
        description: Keep at least one tab — the homepage hides this block if you delete them all
        fields:
          - label: Tabs
            name: tabs
            label_singular: tab
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Tab button text, name: label, widget: string }
              - { label: Headline when selected, name: headline, widget: string, required: false }
              - { label: Paragraph when selected, name: body, widget: text, required: false }
              - { label: Internal name (no spaces), name: id, widget: string, required: false, hint: "Only used behind the scenes. Leave blank and one is made from the tab text." }

      - name: sketches
        label: Music tracks
        file: content/sketches.json
        fields:
          - label: Tracks
            name: tracks
            label_singular: track
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Track title, name: title, widget: string }
              - { label: Short description, name: mood, widget: string, required: false, hint: "Optional line under the title (e.g. “Warm brass · slow pulse”)" }
              - { label: Internal name (no spaces), name: id, widget: string, required: false, hint: "Only used behind the scenes. Leave blank and one is made from the title." }
              - label: Music file
                name: audio
                widget: file
                required: false
                choose_url: false
                # From repo-root global media (public/images): ../audio → public/audio
                media_folder: ../audio
                public_folder: /audio
                hint: "Upload mp3/wav/ogg (best browser support). FLAC often fails in browsers. Leave empty for a placeholder tone."
              - label: Placeholder tempo (optional)
                name: bpm
                widget: number
                value_type: int
                required: false
                hint: "Only used when Music file is empty — sets the placeholder tone speed. Leave blank if unused."
              - { label: Placeholder starting pitch (optional), name: baseFreq, widget: number, required: false, value_type: float, hint: "Only used when Music file is blank. Example: 110" }
              - label: Placeholder note steps (optional)
                name: pattern
                label_singular: step
                widget: list
                required: false
                summary: "{{fields.step}}"
                hint: "Only used when Music file is blank. Numbers like 0, 4, 7 make a simple melody."
                fields:
                  - { label: Note step, name: step, widget: number, value_type: int }

  - name: game_projects
    label: Projects
    label_singular: Project
    description: Games and case studies — each gets its own page at /projects/your-link-name after you publish (wait for the site to rebuild)
    folder: content/projects
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{title}}"
    editor:
      preview: true
      visualEditing: true
    fields:
      - { label: Project title, name: title, widget: string }
      - { label: Small label above the title, name: subtitle, widget: string, required: false, default: "", hint: "Example: 2D top-down RPG · in development" }
      - label: Cover photo
        name: image
        widget: image
        choose_url: false
        required: false
        hint: "Upload or pick from the media library. Leave blank for a plain card."
      - { label: Short card summary, name: summary, widget: text, required: false, default: "", hint: "Shown on the homepage project card" }
      - { label: Page web address, name: slug, widget: string, hint: "The page becomes /projects/this — lowercase, no spaces (example: arena). Must be different from other projects." }
      - { label: Homepage order, name: order, widget: number, value_type: int, default: 10, required: false, hint: "Lower numbers show first" }
      - label: Extra photos
        name: gallery
        label_singular: photo
        widget: list
        required: false
        default: []
        summary: "{{fields.image}}"
        fields:
          - label: Photo
            name: image
            widget: image
            choose_url: false
      - label: Bullet highlights
        name: highlights
        label_singular: highlight
        widget: list
        required: false
        default: []
        summary: "{{fields.item}}"
        fields:
          - { label: Bullet point, name: item, widget: string }
      - label: Buttons (Play, GitHub…)
        name: links
        label_singular: button
        widget: list
        required: false
        default: []
        summary: "{{fields.label}}"
        fields:
          - { label: Button text, name: label, widget: string }
          - { label: Web address, name: href, widget: string, hint: "Full link like https://example.com — or #contact to jump down this page" }
      - label: Opening paragraphs
        name: intro
        label_singular: paragraph
        widget: list
        required: false
        default: []
        summary: "{{fields.paragraph}}"
        fields:
          - { label: Paragraph, name: paragraph, widget: text }
      - label: Page chapters
        name: sections
        label_singular: chapter
        widget: list
        required: false
        default: []
        summary: "{{fields.title}}"
        fields:
          - { label: Chapter title, name: title, widget: string }
          - { label: Quote (optional), name: quote, widget: text, required: false }
          - label: Paragraphs
            name: paragraphs
            label_singular: paragraph
            widget: list
            required: false
            default: []
            summary: "{{fields.paragraph}}"
            fields:
              - { label: Paragraph, name: paragraph, widget: text }
          - label: Photo (optional)
            name: image
            widget: image
            required: false
            choose_url: false
          - { label: Photo description, name: imageAlt, widget: string, required: false }
