name: Static mirror

# Rebuilds the fully static site and deploys it to Cloudflare Pages, so a copy
# of the site stays online even when the Coolify server is down. Runs on every
# push to the content branch — including each "Save & publish" from the admin.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'portfolio-mirror' }} --commit-dirty=true

      - name: Mirror not configured
        if: ${{ secrets.CF_API_TOKEN == '' || secrets.CF_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::Set CF_API_TOKEN and CF_ACCOUNT_ID repo secrets (and optionally the CF_PAGES_PROJECT variable) to enable the Cloudflare Pages mirror. Build still verified."
